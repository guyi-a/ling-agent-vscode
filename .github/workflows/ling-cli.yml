name: Ling CLI

on:
  workflow_dispatch:
  push:
    paths:
      - "ling-cli/**"
      - ".github/workflows/ling-cli.yml"
  pull_request:
    paths:
      - "ling-cli/**"
      - ".github/workflows/ling-cli.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ling-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ling-cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
